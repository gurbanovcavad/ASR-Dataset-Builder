[project]
name = "asr-scraper"
version = "0.1.0"
description = "ASR scraping and processing toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "tenacity>=9.1.4",
    "typer>=0.23.0",
    "yt-dlp[curl-cffi,default]>=2026.2.4",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[project.scripts]
audio-scraper = "asr_scraper.cli:app"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
